<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{title}</title>
<style>
@page {{ size: Letter; margin: 20mm 18mm 18mm 18mm; }}
html {{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }}
body {{ font-family: Georgia, "Times New Roman", serif; font-size: 10.5pt; line-height: 1.45;
        color: #111; margin: 0; }}
/* ---- title page ---- */
.title-page {{ height: 235mm; display: flex; flex-direction: column;
               justify-content: center; align-items: center; text-align: center;
               break-after: page; }}
.title-page .brand {{ font-size: 12pt; letter-spacing: .18em; text-transform: uppercase;
                      color: #555; margin-bottom: 14mm; }}
.title-page h1 {{ font-size: 30pt; margin: 0 0 6mm; border: none; padding: 0; }}
.title-page .sub {{ font-size: 12pt; color: #444; }}
.title-page .rule {{ width: 60mm; border-top: 2px solid #444; margin: 8mm auto; }}
.title-page .foot {{ margin-top: 18mm; font-size: 9.5pt; color: #666; }}
/* ---- contents ---- */
.toc {{ break-after: page; }}
.toc h2 {{ font-size: 16pt; border-bottom: 1px solid #999; padding-bottom: 2mm; }}
.toc ol {{ list-style: decimal; padding-left: 8mm; }}
.toc li {{ margin: 1.6mm 0; }}
.toc a {{ text-decoration: none; color: #111; }}
/* ---- chapters ---- */
.chapter {{ break-before: page; }}
h2 {{ font-size: 17pt; margin: 0 0 4mm; padding-bottom: 1.5mm;
      border-bottom: 1.5px solid #333; break-after: avoid; }}
h3 {{ font-size: 13.5pt; margin: 7mm 0 2mm; break-after: avoid; }}
h4 {{ font-size: 11.5pt; margin: 5mm 0 2mm; break-after: avoid; }}
h5, h6 {{ font-size: 10.5pt; margin: 4mm 0 1.5mm; font-style: italic; break-after: avoid; }}
p {{ margin: 0 0 2.6mm; orphans: 2; widows: 2; }}
a {{ color: #14507a; }}
code {{ font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 9pt;
        background: #f3f3f3; padding: 0 1px; }}
pre {{ background: #f6f6f6; border: 1px solid #ddd; padding: 2mm; overflow-wrap: break-word;
       white-space: pre-wrap; font-size: 8.5pt; break-inside: avoid; }}
blockquote {{ margin: 3mm 0; padding: 2mm 4mm; border-left: 3px solid #b9c6d2;
              background: #f5f8fa; break-inside: avoid; }}
blockquote p {{ margin: 0 0 1.5mm; }}
blockquote p:last-child {{ margin-bottom: 0; }}
table {{ border-collapse: collapse; width: 100%; margin: 3mm 0; font-size: 9pt;
         break-inside: avoid; }}
th, td {{ border: 1px solid #bbb; padding: 1.2mm 2mm; text-align: left;
          vertical-align: top; }}
th {{ background: #eceff1; font-weight: bold; }}
img {{ max-width: 100%; height: auto; display: block; margin: 3mm auto;
       break-inside: avoid; }}
em img, p img {{ break-inside: avoid; }}
ul, ol {{ margin: 0 0 2.6mm; padding-left: 7mm; }}
li {{ margin: 0.8mm 0; }}
hr {{ border: none; border-top: 1px solid #ccc; margin: 4mm 0; }}
/* ---- math ---- */
.eq {{ text-align: center; margin: 3.5mm 0; break-inside: avoid; }}
.eqrow {{ text-align: center; margin: 1.6mm 0; }}
math {{ font-size: 1.02em; }}
/* italic caption lines that follow figures */
p > em:only-child {{ display: block; text-align: center; font-size: 9pt; color: #555; }}
.headerlink {{ display: none; }}
</style></head>
<body>
<div class="title-page">
  <div class="brand">Engineering Dynamics Company</div>
  <h1>{title}</h1>
  <div class="rule"></div>
  <div class="sub">HVE Human Vehicle Environment</div>
  <div class="foot">Markdown Edition &mdash; revised to describe the current version of the software</div>
</div>
<nav class="toc"><h2>Contents</h2><ol>
{toc}
</ol></nav>
{body}
</body></html>
