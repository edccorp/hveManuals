name: Build & deploy HVE manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # The HVE Studio manuals, served under /studio/ beside the classic set.
      # Their source is edccorp/hve-next (scripts/sync_manuals_studio.sh copies
      # it into hve-studio/); never edit hve-studio/ here. -d is relative to
      # hve-studio/mkdocs.yml.
      - name: Build the HVE Studio manuals into /studio/
        run: mkdocs build --strict -f hve-studio/mkdocs.yml -d ../site/studio
      # The DEVELOPMENT preview of the same manuals: what hve-next's main describes, ahead of the release, under /studio/next/.
      # Built after /studio/ (mkdocs empties its output directory first). Nightly syncs write only hve-studio-next/.
      - name: Build the HVE Studio development manuals into /studio/next/
        run: mkdocs build --strict -f hve-studio-next/mkdocs.yml -d ../site/studio/next
      # They were under /2027/ until the product was named HVE Studio
      # (2026-10-20): an old link to any page there lands on the new home.
      - name: Send /2027/ to /studio/
        run: |
          mkdir -p site/2027
          cat > site/2027/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <title>HVE Studio manuals</title>
          <meta http-equiv="refresh" content="0; url=/studio/">
          <link rel="canonical" href="/studio/">
          <p>The HVE Studio manuals have moved to <a href="/studio/">/studio/</a>.</p>
          HTML
          sed -i 's/^          //' site/2027/index.html
      - name: Build the PDF manuals
        run: |
          python -m pip install -r tools/pdf/requirements.txt
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) tools/pdf/build.sh site/pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
