name: Build & deploy HVE manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # The HVE 2027 manuals, served under /2027/ beside the classic set. Their
      # source is edccorp/hve-next (scripts/sync_manuals_2027.sh copies it into
      # hve2027/); never edit hve2027/ here. -d is relative to hve2027/mkdocs.yml.
      - name: Build the HVE 2027 manuals into /2027/
        run: mkdocs build --strict -f hve2027/mkdocs.yml -d ../site/2027
      - name: Build the PDF manuals
        run: |
          python -m pip install -r tools/pdf/requirements.txt
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) tools/pdf/build.sh site/pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
